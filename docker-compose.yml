services:
  app:
    build: .
    ports: ["3000:3000"]
    environment:
      DATABASE_URL: postgresql://fundledger:${POSTGRES_PASSWORD:-change-me}@db:5432/fundledger?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-replace-me-before-production}
      UPLOAD_DIR: /app/uploads
      INITIAL_ADMIN_EMAIL: ${INITIAL_ADMIN_EMAIL:-admin@example.com}
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-change-this-now}
      FX_API_URL: ${FX_API_URL:-https://api.frankfurter.app/latest}
    volumes:
      - ${UPLOAD_PATH:-./uploads}:/app/uploads
    depends_on: [db]
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: fundledger
      POSTGRES_USER: fundledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
volumes:
  postgres_data:
